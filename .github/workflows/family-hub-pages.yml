name: Deploy Family Hub to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "family-hub/**"
      - ".github/workflows/family-hub-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-family-hub"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Family Hub
        uses: actions/upload-pages-artifact@v4
        with:
          path: family-hub
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
